
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Forest Runner Prototype</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0;
    background: #0f1720;
    color: #f5efe6;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: stretch;
  }
  .app {
    width: min(100vw, 900px);
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom)) 10px;
    gap: 10px;
    background:
      radial-gradient(circle at top left, rgba(241, 193, 143, 0.12), transparent 30%),
      linear-gradient(180deg, #0f1720 0%, #172432 100%);
  }
  .hud {
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(17, 25, 34, 0.72);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    min-height: 56px;
    display: flex;
    align-items: center;
    padding: 10px 14px;
    line-height: 1.35;
    font-size: 14px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.18);
  }
  .stageWrap {
    flex: 1;
    border-radius: 22px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.12);
    background: #152232;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    touch-action: none;
  }
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .leftCluster, .rightCluster {
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  .btn {
    width: 86px;
    height: 86px;
    border-radius: 22px;
    border: 1px solid rgba(255,255,255,0.12);
    background:
      linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.015)),
      linear-gradient(180deg, #2a3746, #1a2531);
    color: #f8f0e6;
    font-size: 34px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .btn:active, .btn.pressed {
    transform: translateY(2px) scale(0.985);
    filter: brightness(1.08);
  }
  .tip {
    text-align: center;
    font-size: 11px;
    color: rgba(245,239,230,0.72);
    line-height: 1.35;
  }
</style>
</head>
<body>
<div class="app">
  <div class="hud" id="hud">Загрузка…</div>
  <div class="stageWrap">
    <canvas id="game" width="960" height="540"></canvas>
  </div>
  <div class="controls">
    <div class="leftCluster">
      <button class="btn" id="left">←</button>
      <button class="btn" id="right">→</button>
    </div>
    <div class="rightCluster">
      <button class="btn" id="jump">↑</button>
    </div>
  </div>
  <div class="tip">Теперь это горизонтальный сайдскроллер. Камера идёт за героем, путь реально проходимый.</div>
</div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const hud = document.getElementById("hud");

  const W = canvas.width;
  const H = canvas.height;
  const TILE = 48;
  const GRAVITY = 0.58;
  const RUN = 4.2;
  const JUMP = 11.5;
  const MAX_FALL = 13;

  const PALETTE = {
    skyTop: "#a9d7f2",
    skyBottom: "#f4e3c4",
    mountainFar: "#9eb6b0",
    mountainNear: "#708a7c",
    treeDark: "#29443b",
    treeMid: "#416658",
    bush: "#5f8a6f",
    grass: "#89b67d",
    dirt: "#8a6850",
    dirtDark: "#6e4f3d",
    pathLight: "#b99672",
    coin: "#f5cc6d",
    exit: "#8bd1c2",
    exitDark: "#4f8d81",
    shadow: "rgba(0,0,0,0.18)",
    skin: "#f0d7c2",
    hair: "#3b2d28",
    shirt: "#f0efe8",
    vest: "#7a8fa7",
    pants: "#324256",
    scarf: "#c98073",
    eye: "#1b2229",
    dust: "rgba(255,255,255,0.55)"
  };

  const levels = [
    [
      "................................................................................",
      ".............................................................................E..",
      ".........................................C......................................",
      "....................................###.........................................",
      "............................###.......................###.......................",
      "......................###......................................................",
      "...............###.............................................................",
      "......###......................................###..............................",
      "................................................................................",
      "....P...........................................................................",
      "####################....################....###############....##################",
      "####################....################....###############....##################"
    ],
    [
      "................................................................................",
      ".....................................................................E..........",
      "............................................C...................................",
      ".....................................###........................###.............",
      ".........................###.....................................................",
      "...............###.........................###...................................",
      "..............................................................###...............",
      ".....###.......................................................................",
      ".........................^^^....................................................",
      "..P.............................................................................",
      "#################....###############....#############....########################",
      "#################....###############....#############....########################"
    ],
    [
      "................................................................................",
      ".............................................................................E..",
      ".............................................###................................",
      ".................................C..............................................",
      "..........................###.........................###.......................",
      ".................###............................................................",
      "......................................^^^......................................",
      "......###........................................###............................",
      "................................................................................",
      ".P..............................................................................",
      "################....#################....###############....#####################",
      "################....#################....###############....#####################"
    ]
  ];

  const input = { left:false, right:false, jump:false, jumpLatch:false };
  let levelIndex = 0;
  let level = null;
  let spikes = [];
  let particles = [];
  let cameraX = 0;
  let frame = 0;
  let msg = "Доберись до монеты, потом до выхода";
  let msgTimer = 100;

  const player = {
    x: 0, y: 0, w: 26, h: 48,
    vx: 0, vy: 0,
    onGround: false,
    coyote: 0,
    facing: 1,
    hasCoin: false,
    won: false,
    lives: 3,
    anim: 0,
    squashX: 1,
    squashY: 1
  };

  function flash(text, frames = 90) {
    msg = text;
    msgTimer = frames;
  }

  function setHud() {
    hud.textContent = `Уровень ${levelIndex + 1}/${levels.length} · Жизни ${player.lives} · Монета ${player.hasCoin ? "да" : "нет"} · ${msgTimer > 0 ? msg : "Доберись до монеты, потом до выхода"}`;
  }

  function parseLevel(index) {
    const map = levels[index].map(r => r.split(""));
    const data = {
      map,
      width: map[0].length,
      height: map.length,
      worldW: map[0].length * TILE,
      coin: {x:0, y:0, w:20, h:20, taken:false},
      exit: {x:0, y:0, w:30, h:62, open:false}
    };
    spikes = [];
    for (let y = 0; y < map.length; y++) {
      for (let x = 0; x < map[y].length; x++) {
        const c = map[y][x];
        if (c === "P") {
          player.x = x * TILE + 10;
          player.y = y * TILE - 2;
          map[y][x] = ".";
        } else if (c === "C") {
          data.coin.x = x * TILE + 14;
          data.coin.y = y * TILE + 12;
          map[y][x] = ".";
        } else if (c === "E") {
          data.exit.x = x * TILE + 10;
          data.exit.y = y * TILE - 14;
          map[y][x] = ".";
        } else if (c === "^") {
          spikes.push({x:x*TILE+6, y:y*TILE+28, w:TILE-12, h:18});
          map[y][x] = ".";
        }
      }
    }
    return data;
  }

  function loadLevel(index, keepLives = true) {
    level = parseLevel(index);
    player.vx = 0;
    player.vy = 0;
    player.onGround = false;
    player.coyote = 0;
    player.facing = 1;
    player.hasCoin = false;
    player.won = false;
    player.anim = 0;
    player.squashX = 1;
    player.squashY = 1;
    if (!keepLives) player.lives = 3;
    cameraX = Math.max(0, Math.min(level.worldW - W, player.x - W * 0.35));
    flash("Уровень " + (index + 1), 60);
    setHud();
  }

  function tileAt(tx, ty) {
    if (tx < 0 || ty < 0 || tx >= level.width || ty >= level.height) return "#";
    return level.map[ty][tx];
  }

  function solidAt(px, py) {
    const tx = Math.floor(px / TILE);
    const ty = Math.floor(py / TILE);
    if (tileAt(tx, ty) === "#") return true;
    if (!level.exit.open && px >= level.exit.x && px < level.exit.x + level.exit.w && py >= level.exit.y && py < level.exit.y + level.exit.h) return true;
    return false;
  }

  function overlap(a,b) {
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }

  function spawnDust(x, y, n = 6) {
    for (let i = 0; i < n; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 1.8,
        vy: -Math.random() * 1.2,
        life: 18 + Math.random() * 8,
        size: 2 + Math.random() * 2
      });
    }
  }

  function moveX(v) {
    player.x += v;
    if (v > 0) {
      if (solidAt(player.x + player.w, player.y + 4) || solidAt(player.x + player.w, player.y + player.h - 4)) {
        player.x = Math.floor((player.x + player.w) / TILE) * TILE - player.w - 0.01;
        player.vx = 0;
      }
    } else if (v < 0) {
      if (solidAt(player.x, player.y + 4) || solidAt(player.x, player.y + player.h - 4)) {
        player.x = Math.floor(player.x / TILE + 1) * TILE + 0.01;
        player.vx = 0;
      }
    }
  }

  function moveY(v) {
    const wasGrounded = player.onGround;
    player.y += v;
    player.onGround = false;

    if (v > 0) {
      if (solidAt(player.x + 4, player.y + player.h) || solidAt(player.x + player.w - 4, player.y + player.h)) {
        player.y = Math.floor((player.y + player.h) / TILE) * TILE - player.h - 0.01;
        player.vy = 0;
        player.onGround = true;
        if (!wasGrounded) {
          player.squashX = 1.12;
          player.squashY = 0.86;
          spawnDust(player.x + player.w / 2, player.y + player.h, 7);
        }
      }
    } else if (v < 0) {
      if (solidAt(player.x + 4, player.y) || solidAt(player.x + player.w - 4, player.y)) {
        player.y = Math.floor(player.y / TILE + 1) * TILE + 0.01;
        player.vy = 0;
      }
    }
  }

  function resetLevel(reason) {
    player.lives -= 1;
    if (player.lives <= 0) {
      levelIndex = 0;
      loadLevel(0, false);
      flash("Снова с начала", 120);
    } else {
      loadLevel(levelIndex, true);
      flash(reason, 80);
    }
  }

  function nextLevel() {
    levelIndex += 1;
    if (levelIndex >= levels.length) {
      levelIndex = 0;
      loadLevel(0, false);
      flash("Ты прошёл все уровни", 140);
    } else {
      loadLevel(levelIndex, true);
    }
  }

  function updateParticles() {
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.05;
      p.life -= 1;
    }
    particles = particles.filter(p => p.life > 0);
  }

  function update() {
    frame += 1;
    if (msgTimer > 0) msgTimer -= 1;

    if (player.won) {
      if (msgTimer <= 0) nextLevel();
      setHud();
      updateParticles();
      return;
    }

    if (input.left && !input.right) {
      player.vx = -RUN;
      player.facing = -1;
    } else if (input.right && !input.left) {
      player.vx = RUN;
      player.facing = 1;
    } else {
      player.vx *= 0.76;
      if (Math.abs(player.vx) < 0.05) player.vx = 0;
    }

    if (player.onGround) player.coyote = 7;
    else if (player.coyote > 0) player.coyote -= 1;

    if (input.jump && !input.jumpLatch && player.coyote > 0) {
      player.vy = -JUMP;
      player.onGround = false;
      player.coyote = 0;
      input.jumpLatch = true;
      player.squashX = 0.92;
      player.squashY = 1.12;
    }
    if (!input.jump) input.jumpLatch = false;

    player.vy += GRAVITY;
    if (player.vy > MAX_FALL) player.vy = MAX_FALL;

    moveX(player.vx);
    moveY(player.vy);

    player.anim += Math.abs(player.vx) * 0.16 + 0.04;
    player.squashX += (1 - player.squashX) * 0.18;
    player.squashY += (1 - player.squashY) * 0.18;

    for (const s of spikes) {
      if (overlap(player, s)) {
        resetLevel("Шипы");
        return;
      }
    }

    if (!level.coin.taken && overlap(player, level.coin)) {
      level.coin.taken = true;
      player.hasCoin = true;
      level.exit.open = true;
      flash("Монета найдена. Выход открыт", 100);
    }

    if (level.exit.open && overlap(player, level.exit)) {
      player.won = true;
      flash("Уровень пройден", 70);
    }

    if (player.y > H + 200) {
      resetLevel("Падение");
      return;
    }

    const targetCam = player.x - W * 0.35;
    cameraX += (targetCam - cameraX) * 0.1;
    cameraX = Math.max(0, Math.min(level.worldW - W, cameraX));

    updateParticles();
    setHud();
  }

  function drawNatureBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, PALETTE.skyTop);
    sky.addColorStop(1, PALETTE.skyBottom);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = PALETTE.mountainFar;
    ctx.beginPath();
    ctx.moveTo(0, 260);
    ctx.lineTo(110, 170);
    ctx.lineTo(240, 260);
    ctx.lineTo(380, 145);
    ctx.lineTo(560, 260);
    ctx.lineTo(720, 175);
    ctx.lineTo(960, 260);
    ctx.lineTo(960, H);
    ctx.lineTo(0, H);
    ctx.fill();

    ctx.fillStyle = PALETTE.mountainNear;
    ctx.beginPath();
    ctx.moveTo(0, 300);
    ctx.lineTo(140, 215);
    ctx.lineTo(300, 300);
    ctx.lineTo(470, 205);
    ctx.lineTo(660, 300);
    ctx.lineTo(860, 220);
    ctx.lineTo(960, 300);
    ctx.lineTo(960, H);
    ctx.lineTo(0, H);
    ctx.fill();

    const treeOffset1 = -(cameraX * 0.18) % 180;
    for (let i = -1; i < 8; i++) {
      const x = treeOffset1 + i * 180;
      ctx.fillStyle = PALETTE.treeDark;
      ctx.fillRect(x + 24, 240, 18, 170);
      ctx.beginPath();
      ctx.arc(x + 32, 220, 44, 0, Math.PI * 2);
      ctx.arc(x + 5, 245, 34, 0, Math.PI * 2);
      ctx.arc(x + 60, 248, 36, 0, Math.PI * 2);
      ctx.fill();
    }

    const treeOffset2 = -(cameraX * 0.3) % 130;
    for (let i = -1; i < 10; i++) {
      const x = treeOffset2 + i * 130;
      ctx.fillStyle = PALETTE.treeMid;
      ctx.fillRect(x + 18, 310, 12, 120);
      ctx.beginPath();
      ctx.arc(x + 24, 295, 28, 0, Math.PI * 2);
      ctx.arc(x + 5, 315, 22, 0, Math.PI * 2);
      ctx.arc(x + 42, 315, 22, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawTile(px, py) {
    ctx.fillStyle = PALETTE.dirt;
    ctx.fillRect(px, py, TILE, TILE);
    ctx.fillStyle = PALETTE.dirtDark;
    ctx.fillRect(px, py + TILE - 16, TILE, 16);
    ctx.fillStyle = PALETTE.pathLight;
    ctx.fillRect(px, py, TILE, 12);
    ctx.fillStyle = PALETTE.grass;
    ctx.fillRect(px, py, TILE, 6);
  }

  function drawWorld() {
    ctx.save();
    ctx.translate(-cameraX, 0);

    for (let y = 0; y < level.height; y++) {
      for (let x = 0; x < level.width; x++) {
        const c = level.map[y][x];
        if (c === "#") drawTile(x * TILE, y * TILE);
      }
    }

    for (const s of spikes) {
      ctx.fillStyle = "#dbe1ea";
      for (let i = 0; i < 3; i++) {
        const bx = s.x + i * (s.w / 3);
        ctx.beginPath();
        ctx.moveTo(bx + 2, s.y + s.h);
        ctx.lineTo(bx + s.w / 6, s.y);
        ctx.lineTo(bx + s.w / 3 - 2, s.y + s.h);
        ctx.fill();
      }
    }

    if (!level.coin.taken) {
      const bob = Math.sin(frame * 0.13) * 4;
      ctx.fillStyle = PALETTE.coin;
      ctx.beginPath();
      ctx.arc(level.coin.x + 10, level.coin.y + 10 + bob, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.35)";
      ctx.fillRect(level.coin.x + 7, level.coin.y + 3 + bob, 4, 14);
    }

    ctx.fillStyle = level.exit.open ? PALETTE.exit : PALETTE.exitDark;
    ctx.fillRect(level.exit.x, level.exit.y, level.exit.w, level.exit.h);
    ctx.fillStyle = "#d9f2ec";
    ctx.fillRect(level.exit.x + 6, level.exit.y + 7, 4, 42);
    ctx.fillRect(level.exit.x + 14, level.exit.y + 7, 4, 42);
    ctx.fillRect(level.exit.x + 22, level.exit.y + 7, 4, 42);

    const idleBob = Math.sin(frame * 0.08) * (player.onGround && Math.abs(player.vx) < 0.15 ? 1.5 : 0.2);
    const step = Math.sin(player.anim) * 4;
    const px = player.x;
    const py = player.y + idleBob;

    ctx.fillStyle = PALETTE.shadow;
    ctx.fillRect(px + 3, py + player.h - 2, player.w + 2, 6);

    ctx.save();
    ctx.translate(px + player.w / 2, py + player.h / 2);
    ctx.scale(player.squashX, player.squashY);
    ctx.translate(-(px + player.w / 2), -(py + player.h / 2));

    ctx.fillStyle = PALETTE.skin;
    ctx.fillRect(px + 8, py + 4, 10, 12);

    ctx.fillStyle = PALETTE.hair;
    ctx.fillRect(px + 7, py + 3, 12, 4);

    ctx.fillStyle = PALETTE.shirt;
    ctx.fillRect(px + 6, py + 16, 14, 12);

    ctx.fillStyle = PALETTE.vest;
    ctx.fillRect(px + 5, py + 18, 16, 10);

    ctx.fillStyle = PALETTE.scarf;
    ctx.fillRect(px + 5, py + 17, 16, 3);

    ctx.fillStyle = PALETTE.pants;
    if (player.onGround) {
      ctx.fillRect(px + 7, py + 28, 5, 11 + Math.max(0, step));
      ctx.fillRect(px + 14, py + 28, 5, 11 + Math.max(0, -step));
      ctx.fillRect(px + (player.facing === 1 ? 16 : 2), py + 19, 8, 4);
      ctx.fillRect(px + 5, py + 19, 8, 4);
    } else {
      ctx.fillRect(px + 7, py + 28, 5, 10);
      ctx.fillRect(px + 14, py + 31, 5, 7);
      ctx.fillRect(px + (player.facing === 1 ? 15 : 2), py + 20, 8, 3);
      ctx.fillRect(px + 5, py + 16, 8, 3);
    }

    ctx.fillStyle = PALETTE.eye;
    ctx.fillRect(px + (player.facing === 1 ? 14 : 10), py + 9, 2, 2);

    ctx.restore();

    for (const p of particles) {
      ctx.fillStyle = `rgba(255,255,255,${Math.max(0, p.life / 24)})`;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }

    ctx.restore();

    if (msgTimer > 0) {
      ctx.fillStyle = "rgba(17,25,34,0.38)";
      ctx.fillRect(40, 20, W - 80, 36);
      ctx.strokeStyle = "rgba(255,255,255,0.16)";
      ctx.strokeRect(40, 20, W - 80, 36);
      ctx.fillStyle = "#fff7ee";
      ctx.font = "16px -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(msg, W / 2, 44);
    }
  }

  function loop() {
    update();
    drawNatureBackground();
    drawWorld();
    requestAnimationFrame(loop);
  }

  function bindHold(id, key) {
    const el = document.getElementById(id);
    const on = (e) => { e.preventDefault(); input[key] = true; el.classList.add("pressed"); };
    const off = (e) => { e.preventDefault(); input[key] = false; el.classList.remove("pressed"); };
    ["touchstart","pointerdown","mousedown"].forEach(ev => el.addEventListener(ev, on, {passive:false}));
    ["touchend","touchcancel","pointerup","pointercancel","mouseup","mouseleave"].forEach(ev => el.addEventListener(ev, off, {passive:false}));
  }

  bindHold("left", "left");
  bindHold("right", "right");
  bindHold("jump", "jump");

  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") input.left = true;
    if (e.key === "ArrowRight") input.right = true;
    if (e.key === "ArrowUp" || e.key === " ") input.jump = true;
  });
  window.addEventListener("keyup", (e) => {
    if (e.key === "ArrowLeft") input.left = false;
    if (e.key === "ArrowRight") input.right = false;
    if (e.key === "ArrowUp" || e.key === " ") input.jump = false;
  });

  loadLevel(0, false);
  loop();
})();
</script>
</body>
</html>
